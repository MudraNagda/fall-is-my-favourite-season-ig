<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beech Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Instrument+Serif:ital@1&display=swap">
<style>
  /* One committed visual world: an autumn beech wood seen from the ground.
     No light/dark split; every colour is painted explicitly. */
  :root {
    --sky: #0466C8;
    --ink: #2a1d14;
    --paper: #f6ecd9;
    --ui: rgba(255, 255, 255, 0.75); /* text and controls: white on blue, deep sky blue on the wash */
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--paper);
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    /* faded-print look: a little less saturation and contrast, a warm cast */
    filter: saturate(0.84) contrast(0.93) sepia(0.12) brightness(1.03);
  }
  /* loose leaves drifting across the frame once the camera reaches the treetops.
     The canvas sits above the white-out layer and above the words, so leaves keep
     falling over the white and pass in front of the text. */
  .leaf {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* painterly finish: paper grain + a warm vignette pulling the corners in,
     the way the photo's edges fall into shadowed foliage */
  .grain, .wash, .leak, .vignette, .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  /* live film grain: a noise canvas redrawn ~24 times a second */
  .grain {
    width: 100%;
    height: 100%;
    opacity: 0.3;
    /* hard-light, not overlay: overlay does nothing over white, hard-light still
       lets the dark specks through, so the grain carries onto the wash */
    mix-blend-mode: hard-light;
  }
  /* lifted blacks and a faded amber cast, like an old colour print */
  .wash {
    background: linear-gradient(180deg, rgba(255, 214, 150, 0.16), rgba(255, 190, 120, 0.1));
    mix-blend-mode: screen;
  }
  /* a slow light leak drifting in from one corner */
  .leak {
    background: radial-gradient(ellipse 60% 50% at 88% 10%, rgba(255, 150, 60, 0.42) 0%, rgba(255, 120, 50, 0.12) 40%, rgba(255, 100, 40, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: leak 14s ease-in-out infinite alternate;
  }
  @keyframes leak {
    0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
    100% { transform: translate(-6%, 8%) scale(1.15); opacity: 0.7; }
  }
  @media (prefers-reduced-motion: reduce) {
    .leak { animation: none; }
  }
  .vignette {
    background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(60, 30, 10, 0) 55%, rgba(60, 30, 10, 0.42) 100%);
    transition: opacity 1.4s ease;
  }
  .vignette.lift { opacity: 0; }
  /* the white-out at the top of the flight, then the return to the ground */
  .flash {
    background: #fbfaf4;
    opacity: 0;
    transition: opacity 0.4s ease; /* only the fade back out on replay */
  }
  .flash.on { opacity: 1; transition: none; } /* while flying, its radial gradient is driven per frame */
  /* one line of guidance in the centre of the sky */
  .msg {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 0 max(24px, calc(50% - 330px)); /* keeps the longer line to a readable measure */
    text-wrap: balance;
    pointer-events: none;
    font: italic 400 19px/1.45 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    letter-spacing: 0.005em;
    color: var(--ui);
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .msg.show { opacity: 1; }
  /* plain text button on the bottom edge, shown once the flight is over */
  .replay {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    padding: 18px 24px;
    border: 0;
    background: none;
    font: 600 12px/1 'Inter', system-ui, -apple-system, sans-serif;
    letter-spacing: 0.01em;
    color: var(--ui);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:focus-visible, .zoom input:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
  /* camera height: a hairline on the right edge with snapped stops */
  .zoom {
    position: fixed;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: stretch;
    gap: 8px;
    height: 150px;
    color: var(--ui);
    font: 600 10px/1 'Inter', system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .zoom ol {
    list-style: none;
    margin: 0;
    padding: 1px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    opacity: 0.8;
  }
  .zoom[hidden] { display: none; }
  .zoom.off { opacity: 0.35; pointer-events: none; }
  .zoom { transition: opacity 0.4s ease; }
  .zoom input {
    -webkit-appearance: none;
    appearance: none;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 14px;
    height: 100%;
    margin: 0;
    padding: 0;
    color: inherit;
    background: linear-gradient(currentColor, currentColor) center / 1px 100% no-repeat;
    cursor: pointer;
  }
  .zoom input::-webkit-slider-runnable-track { background: transparent; }
  .zoom input::-moz-range-track { background: transparent; }
  .zoom input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }
  .zoom input::-moz-range-thumb {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }

</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="wash"></div>
<div class="leak"></div>
<div class="vignette"></div>
<div class="flash" id="flash"></div>
<p class="msg" id="msg"></p>
<canvas class="leaf" id="leaf"></canvas>
<canvas class="grain" id="grain"></canvas>
<button class="replay" id="replay" type="button">replay</button>
<!-- the height slider is hidden for now: remove the "hidden" attribute to bring it back -->
<label class="zoom" id="zoom" hidden aria-label="Camera height, as a percentage of tree height">
  <ol aria-hidden="true"><li>125</li><li>100</li><li>75</li><li>50</li><li>25</li><li>0</li></ol>
  <input id="zoomRange" type="range" min="0" max="125" step="1" value="10" aria-valuetext="10%">
</label>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';

// ---------------------------------------------------------------------------
// A beech wood in October, seen lying on the ground: pale trunks converge on
// the zenith through a wide lens, the crowns are painted as dabs of
// yellow-green, amber and flame, and two dark spruces crowd the edge of the
// frame. A click fires the viewer straight up the trunk line, through the
// canopy, into open blue.
// ---------------------------------------------------------------------------

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// deterministic rng so the wood is the same wood on every visit
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry(20261012);
const rr = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

// ---- palette (sRGB, converted to linear by THREE.Color) --------------------
const SKY_ZENITH = new THREE.Color('#0466C8');
const SKY_HORIZON = new THREE.Color('#0466C8');
const SUN_GLOW = new THREE.Color('#f7ecc4'); // the faint yellow the sky passes through
const SKY_WHITE = new THREE.Color('#fbfaf4'); // then almost white
const FOG = new THREE.Color('#0466C8');
const SUN_DIR = new THREE.Vector3(-0.62, 0.66, -0.42).normalize();

// leaf families: A and B are the two hues each dab blends between
const FAMILIES = {
  // the brief's four swatches only: 8EA604 / F5BB00 / EC9F05 / BF3100
  gold:  ['#F5BB00', '#EC9F05'],
  amber: ['#EC9F05', '#F5BB00'],
  flame: ['#EC9F05', '#BF3100'],
  ember: ['#BF3100', '#EC9F05'],
  olive: ['#8EA604', '#F5BB00'],
  lime:  ['#8EA604', '#8EA604'],
  spruce: ['#8EA604', '#8EA604'],
};

// ---- renderer / scene ------------------------------------------------------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG, 34, 150);

const camera = new THREE.PerspectiveCamera(96, 1, 0.05, 600);
const GROUND_Y = 10; // start about a quarter of the way up the trunks
camera.position.set(0, GROUND_Y, 0); // moved to the 10% start once the tree height is known

// light: a low warm sun off to the upper left, cool sky fill, warm bounce
scene.add(new THREE.HemisphereLight(new THREE.Color('#a9c9ec'), new THREE.Color('#8a6a4a'), 1.7));
const sun = new THREE.DirectionalLight(new THREE.Color('#ffe6c8'), 2.2);
sun.position.copy(SUN_DIR).multiplyScalar(100);
scene.add(sun);

// ---- sky dome --------------------------------------------------------------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uZenith: { value: SKY_ZENITH },
      uHorizon: { value: SKY_HORIZON },
      uGlow: { value: SUN_GLOW },
      uWhite: { value: SKY_WHITE },
      uSun: { value: SUN_DIR },
      uLift: { value: 0 },  // 0..1, how far the light has opened
      uReach: { value: 1 }, // angle from the zenith to the corner of the frame
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uZenith, uHorizon, uGlow, uWhite, uSun; uniform float uLift, uReach;
      varying vec3 vDir;
      void main() {
        float h = clamp(vDir.y, 0.0, 1.0);
        vec3 col = mix(uHorizon, uZenith, pow(h, 0.65));
        // the light opens from straight overhead and spreads to the corners with a
        // very soft edge; each point passes through the faint yellow, then white
        float r = acos(clamp(vDir.y, -1.0, 1.0)) / uReach;
        float feather = 0.8;
        float local = smoothstep(0.0, 1.0, (uLift * (1.0 + feather) - r) / feather);
        col = mix(col, uGlow, smoothstep(0.0, 0.5, local));
        col = mix(col, uWhite, smoothstep(0.3, 1.0, local));
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  }),
);
scene.add(sky);

// ---- bark texture: dark brown, mottled, a little lichen ---------------------
function barkTexture() {
  const W = 256, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7d5d45';
  ctx.fillRect(0, 0, W, H);
  const r = mulberry(77);
  const blot = (color, n, rx, ry, alpha) => {
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) {
      ctx.globalAlpha = alpha * (0.5 + r());
      ctx.beginPath();
      ctx.ellipse(r() * W, r() * H, rx * (0.4 + r()), ry * (0.4 + r()), r() * 6.3, 0, 6.3);
      ctx.fill();
    }
  };
  blot('#9c7b5e', 200, 30, 48, 0.26);   // warmer patches
  blot('#4a372a', 180, 24, 40, 0.2);    // deep shadows
  blot('#5e5a3a', 70, 16, 22, 0.14);    // lichen
  blot('#241a12', 220, 10, 2, 0.18);    // lenticel scratches, horizontal
  blot('#3a2b1f', 40, 3, 90, 0.14);     // faint vertical seams
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

// ---- leaf dab atlas ----------------------------------------------------------
// 2x2 atlas of painterly "dabs": each cell is 3-5 overlapping leaf shapes.
// R channel = which of the two family hues this leaf takes, G = luminance
// shading, A = coverage with a softened, slightly ragged edge.
function dabAtlas() {
  const S = 512, CELL = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  const r = mulberry(4242);
  const leaf = (cx, cy, ang, len, wid, hue, lum) => {
    // pointed ellipse with a jittered outline
    const pts = [];
    const n = 22;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const ex = Math.cos(a) * len;
      const ey = Math.sin(a) * wid * (0.75 + 0.25 * Math.abs(Math.cos(a)));
      const j = 1 + (r() - 0.5) * 0.16;
      pts.push([
        cx + (ex * Math.cos(ang) - ey * Math.sin(ang)) * j,
        cy + (ex * Math.sin(ang) + ey * Math.cos(ang)) * j,
      ]);
    }
    const g = ctx.createLinearGradient(
      cx - Math.cos(ang) * len, cy - Math.sin(ang) * len,
      cx + Math.cos(ang) * len, cy + Math.sin(ang) * len,
    );
    const hueByte = Math.round(hue * 255);
    g.addColorStop(0, `rgb(${hueByte},${Math.round(lum * 0.72 * 255)},0)`);
    g.addColorStop(1, `rgb(${hueByte},${Math.round(lum * 255)},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < n; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fill();
    // shadowed rim so each leaf keeps its outline where dabs overlap
    ctx.strokeStyle = `rgb(${hueByte},${Math.round(lum * 0.42 * 255)},0)`;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.stroke();
  };
  for (let cell = 0; cell < 4; cell++) {
    const ox = (cell % 2) * CELL, oy = Math.floor(cell / 2) * CELL;
    const count = 3 + Math.floor(r() * 3);
    for (let i = 0; i < count; i++) {
      leaf(
        ox + CELL / 2 + (r() - 0.5) * 90,
        oy + CELL / 2 + (r() - 0.5) * 90,
        r() * Math.PI,
        44 + r() * 30,
        22 + r() * 14,
        r(),
        0.32 + r() * 0.68,
      );
    }
  }
  // soften edges a touch so the alpha cutout reads like a wet brush edge
  const soft = document.createElement('canvas');
  soft.width = S; soft.height = S;
  const sctx = soft.getContext('2d');
  sctx.filter = 'blur(1.2px)';
  sctx.drawImage(c, 0, 0);
  const tex = new THREE.CanvasTexture(soft);
  tex.colorSpace = THREE.NoColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

// ---- geometry builders ----------------------------------------------------
// One merged buffer per tree for branches; one global buffer for twig lines;
// one global instanced buffer for every leaf dab in the wood.
class TubeBuilder {
  constructor() { this.pos = []; this.nor = []; this.uv = []; this.idx = []; this.count = 0; }
  // path: [{p: Vector3, r: number}], sides: ring resolution
  addPath(path, sides) {
    const base = this.count;
    let N = new THREE.Vector3();
    let arc = 0;
    const T = new THREE.Vector3(), B = new THREE.Vector3(), tmp = new THREE.Vector3();
    for (let i = 0; i < path.length; i++) {
      const p = path[i].p;
      const next = path[Math.min(i + 1, path.length - 1)].p;
      const prev = path[Math.max(i - 1, 0)].p;
      T.subVectors(next, prev).normalize();
      if (i === 0) {
        tmp.set(1, 0, 0);
        if (Math.abs(T.dot(tmp)) > 0.9) tmp.set(0, 0, 1);
        N.crossVectors(T, tmp).normalize();
      } else {
        arc += p.distanceTo(prev);
        // parallel-transport the frame so the tube doesn't twist
        N.sub(tmp.copy(T).multiplyScalar(N.dot(T))).normalize();
      }
      B.crossVectors(T, N);
      const rad = path[i].r;
      for (let j = 0; j <= sides; j++) {
        const a = (j / sides) * Math.PI * 2;
        const nx = N.x * Math.cos(a) + B.x * Math.sin(a);
        const ny = N.y * Math.cos(a) + B.y * Math.sin(a);
        const nz = N.z * Math.cos(a) + B.z * Math.sin(a);
        this.pos.push(p.x + nx * rad, p.y + ny * rad, p.z + nz * rad);
        this.nor.push(nx, ny, nz);
        this.uv.push(j / sides, arc / 2.4);
      }
    }
    const ring = sides + 1;
    for (let i = 0; i < path.length - 1; i++) {
      for (let j = 0; j < sides; j++) {
        const a = base + i * ring + j, b = a + 1, c = a + ring, d = c + 1;
        this.idx.push(a, c, b, b, c, d);
      }
    }
    this.count += path.length * ring;
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    return g;
  }
}

const twigPos = [];
const leaves = { pos: [], quat: [], scale: [], colA: [], colB: [], misc: [] };
const tmpQ = new THREE.Quaternion(), tmpQ2 = new THREE.Quaternion();
const Z = new THREE.Vector3(0, 0, 1), Y = new THREE.Vector3(0, 1, 0);
const familyColors = {};
for (const [k, [a, b]] of Object.entries(FAMILIES)) familyColors[k] = [new THREE.Color(a), new THREE.Color(b)];

function addDab(p, family, scale) {
  // keep a window of sky open straight overhead. Most leaves inside that cone
  // are "flight-only": scaled to nothing while the viewer lies on the ground,
  // grown in once the camera lifts, so the ascent still pushes through foliage.
  let flightOnly = 0;
  const off = Math.hypot(p.x, p.z);
  if (off < p.y * 0.2) {
    // the original window. Its early return and its one random draw are kept
    // exactly as they were, so the seeded wood grows identically.
    if (p.y < 18) return;
    if (p.y < 22 || rnd() < 0.75) flightOnly = 1;
  } else if (off < p.y * 0.25) {
    // a slightly wider ring of sky: these dabs also wait for the flight. No
    // random draw here, so nothing downstream shifts.
    flightOnly = 1;
  }
  // face mostly downward/upward (seen from below), random tilt and spin
  const tilt = rnd() < 0.65 ? rr(0, 0.7) : rr(0.7, 1.5);
  const az = rr(0, Math.PI * 2);
  const normal = new THREE.Vector3(Math.sin(tilt) * Math.cos(az), Math.cos(tilt), Math.sin(tilt) * Math.sin(az));
  tmpQ.setFromUnitVectors(Z, normal);
  tmpQ2.setFromAxisAngle(Z, rr(0, Math.PI * 2));
  tmpQ.multiply(tmpQ2);
  const [a, b] = familyColors[family];
  const jitter = rr(0.82, 1.18);
  leaves.pos.push(p.x, p.y, p.z);
  leaves.quat.push(tmpQ.x, tmpQ.y, tmpQ.z, tmpQ.w);
  leaves.scale.push(scale);
  leaves.colA.push(a.r * jitter, a.g * jitter, a.b * jitter);
  leaves.colB.push(b.r * jitter, b.g * jitter, b.b * jitter);
  leaves.misc.push(rr(0, Math.PI * 2), Math.floor(rnd() * 4), flightOnly, rr(0.55, 1.15));
}

// perturb a direction by a random vector, keep unit length
const _v = new THREE.Vector3();
function wobble(dir, amount, upBias) {
  _v.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(amount);
  dir.add(_v).addScaledVector(Y, upBias).normalize();
  return dir;
}
function perpendicular(dir) {
  _v.set(rr(-1, 1), rr(-1, 1), rr(-1, 1));
  return _v.sub(dir.clone().multiplyScalar(_v.dot(dir))).normalize().clone();
}

// A crown branch: curved tube, children at the tip and along the outer half,
// leaf dabs along everything from lod.leafDepth outward.
function growBranch(tb, start, dir, len, r0, r1, depth, lod, family) {
  const segs = 4;
  const path = [{ p: start.clone(), r: r0 }];
  const d = dir.clone();
  let p = start.clone();
  for (let i = 1; i <= segs; i++) {
    wobble(d, 0.16, 0.05);
    p = p.clone().addScaledVector(d, len / segs);
    path.push({ p, r: r0 + (r1 - r0) * (i / segs) });
  }
  if (depth < lod.maxDepth) tb.addPath(path, Math.max(3, 7 - depth * 2));
  else for (let i = 0; i < segs; i++) twigPos.push(path[i].p.x, path[i].p.y, path[i].p.z, path[i + 1].p.x, path[i + 1].p.y, path[i + 1].p.z);

  if (depth >= lod.leafDepth) {
    const step = lod.leafStep;
    for (let s = step * 0.5; s < len; s += step) {
      const i = Math.min(segs - 1, Math.floor((s / len) * segs));
      const t = (s / len) * segs - i;
      const c = path[i].p.clone().lerp(path[i + 1].p, t);
      const n = lod.dabsPerCluster;
      for (let k = 0; k < n; k++) {
        const q = c.clone().add(new THREE.Vector3(rr(-1, 1), rr(-0.6, 0.6), rr(-1, 1)).multiplyScalar(lod.spread));
        addDab(q, family, rr(0.38, 0.72) * lod.dabScale);
      }
    }
  }
  if (depth >= lod.maxDepth) return;
  const kids = 2 + (rnd() < 0.55 ? 1 : 0);
  for (let k = 0; k < kids; k++) {
    const at = k === 0 ? 1 : rr(0.55, 0.95);
    const i = Math.min(segs - 1, Math.floor(at * segs));
    const t = at * segs - i;
    const origin = path[i].p.clone().lerp(path[i + 1].p, t);
    const axis = perpendicular(d);
    const cd = d.clone().applyAxisAngle(axis, k === 0 ? rr(0.15, 0.4) : rr(0.5, 0.95));
    cd.addScaledVector(Y, 0.25).normalize();
    const cr0 = r0 + (r1 - r0) * at;
    growBranch(tb, origin, cd, len * rr(0.58, 0.74), cr0 * 0.9, cr0 * 0.42, depth + 1, lod, family);
  }
}

function beech(tree) {
  const tb = new TubeBuilder();
  const { x, z, height: H, baseR, lean, family, lod } = tree;
  // trunk: near-vertical with a gentle lean and slight waver
  const path = [];
  const d = new THREE.Vector3(lean.x, 1, lean.z).normalize();
  let p = new THREE.Vector3(x, -0.5, z);
  const segs = 14;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const r = baseR * Math.pow(1 - t, 0.85) + 0.03;
    path.push({ p: p.clone(), r });
    wobble(d, 0.05, 0.02);
    p = p.clone().addScaledVector(d, H / segs);
  }
  tb.addPath(path, 10);
  // crown: branches leave the trunk from ~45% up, rising and spreading
  const crownStart = 0.42 + rnd() * 0.1;
  const nBranches = lod.branches;
  for (let i = 0; i < nBranches; i++) {
    const t = crownStart + (1 - crownStart) * ((i + rnd() * 0.8) / nBranches);
    const seg = Math.min(segs - 1, Math.floor(t * segs));
    const origin = path[seg].p.clone().lerp(path[seg + 1].p, t * segs - seg);
    const trunkDir = path[seg + 1].p.clone().sub(path[seg].p).normalize();
    const axis = perpendicular(trunkDir);
    // steeper branches near the top, spreading ones lower down
    const ang = rr(0.55, 1.1) * (1 - (t - crownStart) * 0.5);
    const bd = trunkDir.clone().applyAxisAngle(axis, ang);
    bd.add(new THREE.Vector3(x, 0, z).normalize().multiplyScalar(0.45)).normalize(); // crowns open outward
    const len = H * rr(0.2, 0.3) * (1 - (t - crownStart) * 0.35);
    const r = path[seg].r;
    growBranch(tb, origin, bd, len, r * 0.55, r * 0.22, 1, lod, family);
  }
  const g = tb.build();
  return g;
}

// A spruce: straight trunk, whorls of drooping branches, dark dense dabs.
function spruce(tree) {
  const tb = new TubeBuilder();
  const { x, z, height: H, baseR, lod } = tree;
  const path = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    path.push({ p: new THREE.Vector3(x + rr(-0.05, 0.05), -0.5 + H * t, z + rr(-0.05, 0.05)), r: baseR * (1 - t) + 0.03 });
  }
  tb.addPath(path, 8);
  for (let y = H * 0.25; y < H * 0.97; y += 0.9) {
    const n = 4 + Math.floor(rnd() * 3);
    const reach = (1 - y / H) * H * 0.22 + 0.4;
    for (let k = 0; k < n; k++) {
      const a = rr(0, Math.PI * 2);
      const dir = new THREE.Vector3(Math.cos(a), -0.28, Math.sin(a)).normalize();
      const start = new THREE.Vector3(x, y, z);
      const bp = [{ p: start, r: 0.06 }];
      let q = start.clone();
      for (let i = 1; i <= 3; i++) {
        q = q.clone().addScaledVector(dir, reach / 3);
        q.y -= 0.05 * i;
        bp.push({ p: q.clone(), r: 0.06 * (1 - i / 3) + 0.01 });
        for (let m = 0; m < lod.dabsPerCluster; m++) {
          addDab(q.clone().add(new THREE.Vector3(rr(-1, 1), rr(-0.7, 0.3), rr(-1, 1)).multiplyScalar(0.45)), 'spruce', rr(0.4, 0.7) * lod.dabScale);
        }
      }
      tb.addPath(bp, 4);
    }
  }
  return tb.build();
}

  side: THREE.DoubleSide,

    uMap: { value: dabAtlas() },
    uTime: { value: 0 },

    uFogColor: { value: FOG },
    uFogRange: { value: new THREE.Vector2(34, 150) },
    uSun: { value: SUN_DIR },
  },
  vertexShader: `
    attribute vec3 iPos; attribute vec4 iQuat; attribute float iScale;
    attribute vec3 iColA; attribute vec3 iColB; attribute vec4 iMisc;
    uniform float uTime, uWind; uniform vec2 uFogRange; uniform vec3 uSun;
    varying vec2 vUv; varying vec3 vColA, vColB; varying float vFog, vNear, vShade;
    vec3 qrot(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
    void main() {
      float phase = iMisc.x;
      vUv = (uv + vec2(mod(iMisc.y, 2.0), floor(iMisc.y / 2.0))) * 0.5;
      // flutter: each dab rocks on its stem

      float show = iMisc.z > 0.5 ? smoothstep(12.0, 20.0, cameraPosition.y) : 1.0;

      float gust = 0.7 + 0.3 * sin(uTime * 0.21 + world.x * 0.05);
      world.xz += vec2(sin(uTime * 0.45 + phase), cos(uTime * 0.34 + phase * 0.7)) * sway * gust * uWind;
      float dist = length(world - cameraPosition);
      vFog = smoothstep(uFogRange.x, uFogRange.y, dist);
      vNear = smoothstep(0.12, 0.8, dist);

      vec3 n = normalize(qrot(iQuat, vec3(0.0, 0.0, 1.0)));

    uniform sampler2D uMap; uniform vec3 uFogColor;

});

function puffTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const r = mulberry(5);
  // several soft blobs offset from centre, so a puff is lumpy rather than round
  for (let i = 0; i < 7; i++) {
    const cx = S / 2 + (r() - 0.5) * S * 0.36;
    const cy = S / 2 + (r() - 0.5) * S * 0.36;
    const rad = S * (0.18 + r() * 0.22);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, 'rgba(255,255,255,0.32)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

});

// ---- music ------------------------------------------------------------------
// Browsers only allow sound after a user gesture, so music starts on the first
// click or key press and then never stops: it loops through every flight.
// To use your own track, put the file next to this page and set MUSIC_FILE to
// its name (for example 'music.mp3'); it is looped instead. Left empty, a quiet
// generated piece plays: a slow D-minor pad with sparse plucked notes and a
// long echo. Press M to mute.
const MUSIC_FILE = '';
let music = null;
function startMusic() {
  if (music) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = AC ? new AC() : null; // created inside the gesture so it is allowed to run
  music = { ctx, el: null, master: null, muted: false };
  if (!MUSIC_FILE) { if (ctx) generated(ctx); return; }
  const el = new Audio(MUSIC_FILE);
  el.loop = true;
  el.volume = 0.6;
  el.play().then(() => { music.el = el; if (ctx) ctx.close(); music.ctx = null; })
    .catch(() => { if (ctx) generated(ctx); }); // file missing or blocked: fall back
}
function toggleMute() {
  if (!music) return;
  music.muted = !music.muted;
  if (music.el) music.el.muted = music.muted;
  if (music.master) music.master.gain.setTargetAtTime(music.muted ? 0 : 0.5, music.ctx.currentTime, 0.2);
}
function generated(ctx) {
  ctx.resume();
  const master = ctx.createGain();
  master.gain.value = 0;
  master.gain.setTargetAtTime(0.5, ctx.currentTime, 1.5);
  const comp = ctx.createDynamicsCompressor();
  master.connect(comp).connect(ctx.destination);
  music.master = master;
  // long soft echo
  const delay = ctx.createDelay(1.5); delay.delayTime.value = 0.46;
  const fb = ctx.createGain(); fb.gain.value = 0.42;
  const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1800;
  delay.connect(damp).connect(fb).connect(delay);
  delay.connect(master);
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  // Dm, Bb, F, C: one chord every 10 seconds, voiced low
  const CHORDS = [[50, 57, 65, 69], [46, 53, 62, 65], [53, 60, 65, 69], [48, 55, 64, 67]];
  const SCALE = [62, 65, 67, 69, 72, 74, 77, 79]; // D minor pentatonic
  function pad(notes, at, len) {
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(0.11, at + 3.5);
    g.gain.setValueAtTime(0.11, at + len - 1);
    g.gain.linearRampToValueAtTime(0, at + len + 4);
    f.connect(g).connect(master);
    for (const n of notes) for (const det of [-5, 5]) {
      const o = ctx.createOscillator();
      o.type = det < 0 ? 'triangle' : 'sine';
      o.frequency.value = hz(n);
      o.detune.value = det;
      o.connect(f);
      o.start(at);
      o.stop(at + len + 4.2);
    }
  }
  function pluck(n, at, vel) {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(n);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(2600, at);
    f.frequency.exponentialRampToValueAtTime(500, at + 1.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vel, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 2.4);
    o.connect(f).connect(g);
    g.connect(master);
    g.connect(delay);
    o.start(at);
    o.stop(at + 2.5);
  }
  // look-ahead scheduler, so timing survives a throttled background tab
  let nextChord = ctx.currentTime + 0.1, chordI = 0, nextPluck = ctx.currentTime + 2, last = 3;
  setInterval(() => {
    const horizon = ctx.currentTime + 2.5;
    while (nextChord < horizon) { pad(CHORDS[chordI++ % CHORDS.length], nextChord, 10); nextChord += 10; }
    while (nextPluck < horizon) {
      // wander stepwise through the scale, like leaves coming down one at a time
      last = Math.max(0, Math.min(SCALE.length - 1, last + Math.floor(Math.random() * 5) - 2));
      pluck(SCALE[last], nextPluck, 0.1 + Math.random() * 0.08);
      if (Math.random() < 0.25) pluck(SCALE[last] - 12, nextPluck + 0.02, 0.07);
      nextPluck += [0.75, 1.5, 1.5, 2.25, 3][Math.floor(Math.random() * 5)];
    }
  }, 500);
}

    c.quadraticCurveTo(8, 50, 0, 50);                  // rounded base
    c.quadraticCurveTo(-8, 50, -16, 40);
    c.bezierCurveTo(-38, 6, -30, -34, 0, -56);
    c.closePath();
  };

  stops.forEach((col, i) => g.addColorStop(i / (stops.length - 1), col));
  body(); c.fillStyle = g; c.fill();
  c.save(); body(); c.clip();
  c.strokeStyle = 'rgba(110, 50, 0, 0.4)'; c.lineWidth = 1.4; c.lineCap = 'round';
  for (let i = 0; i < 7; i++) {                        // side veins off the midrib
    const y = -40 + i * 12;
    for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(0, y + 6); c.quadraticCurveTo(sx * 14, y, sx * 34, y - 10); c.stroke(); }
  }
  c.restore();
  c.strokeStyle = 'rgba(100, 45, 0, 0.65)'; c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(0, -54); c.lineTo(0, 62); c.stroke(); // midrib and stalk
  body(); c.strokeStyle = 'rgba(130, 60, 0, 0.5)'; c.lineWidth = 1.6; c.stroke();
  // a very soft U across the blade: a shallow shaded trough along the spine,
  // easing up to lighter, lifted edges
  c.save(); body(); c.clip();
  const u = c.createLinearGradient(-38, 0, 38, 0);
  u.addColorStop(0, 'rgba(255, 245, 210, 0.2)');
  u.addColorStop(0.3, 'rgba(255, 245, 210, 0)');
  u.addColorStop(0.5, 'rgba(70, 30, 0, 0.2)');
  u.addColorStop(0.7, 'rgba(255, 245, 210, 0)');
  u.addColorStop(1, 'rgba(255, 245, 210, 0.2)');
  c.fillStyle = u; c.fillRect(-64, -64, 128, 128);
  c.restore();
  // shaded twin, blended over whichever half is turned away from the light
  const dk = document.createElement('canvas');
  dk.width = dk.height = 128;
  const d = dk.getContext('2d');
  d.drawImage(cv, 0, 0);
  d.globalCompositeOperation = 'source-atop';
  d.fillStyle = 'rgba(60, 25, 0, 0.55)';
  d.fillRect(0, 0, 128, 128);
  return { base: cv, dark: dk };
}
// Every leaf is painted for itself: two or three stops picked from anywhere
// between the four swatches (a touch muted to sit with the faded print), each
// nudged lighter or darker, so no two leaves share a colour.
const SWATCHES = [[143, 159, 30], [233, 180, 23], [222, 154, 28], [179, 66, 26]]; // green, yellow, orange, red
function randomLeafColour() {
  const at = Math.random() * (SWATCHES.length - 1);
  const i = Math.floor(at), k = at - i;
  const shade = 0.82 + Math.random() * 0.3;
  const ch = (n) => Math.max(0, Math.min(255, Math.round((SWATCHES[i][n] + (SWATCHES[i + 1][n] - SWATCHES[i][n]) * k) * shade)));
  return `rgb(${ch(0)}, ${ch(1)}, ${ch(2)})`;
}
const randomLeafSprite = () => leafSprite(Array.from({ length: 2 + Math.floor(Math.random() * 2) }, randomLeafColour));
const looseLeaves = [];
const MAX_LEAVES = 5; // per visit above the treetops, the first one included
let lastT = 0, nextLeafAt = 0, heroDue = false, leavesMade = 0;
function spawnLeaf(t, hero) {
  const W = innerWidth, H = innerHeight;
  let from, aim;
  if (hero) {
    from = { x: W / 2, y: H + 40 };
    aim = { x: W + 40, y: H / 2 };
  } else {
    // start somewhere along the bottom or the two sides, aimed at a random spot inside
    const edge = Math.random();
    if (edge < 0.45) from = { x: Math.random() * W, y: H + 40 };
    else if (edge < 0.725) from = { x: -40, y: H * (0.25 + Math.random() * 0.7) };
    else from = { x: W + 40, y: H * (0.25 + Math.random() * 0.7) };
    aim = { x: W * (0.12 + Math.random() * 0.76), y: H * (0.08 + Math.random() * 0.5) };
  }
  const T = hero ? 3.4 + Math.random() * 1.6 : 2.8 + Math.random() * 4.2; // seconds a full crossing would take
  const total = Math.hypot(aim.x - from.x, aim.y - from.y);
  looseLeaves.push({
    x: from.x, y: from.y, from, total,
    push: { x: (aim.x - from.x) / T, y: (aim.y - from.y) / T },
    vx: (aim.x - from.x) / T, vy: (aim.y - from.y) / T,
    giveOut: hero ? 0.4 : 0.2 + Math.random() * 0.55,      // fraction of the way before the push dies
    fallAt: null,
    // everything below is rolled per leaf, the first one included
    curl: (Math.random() - 0.5) * 70,                      // the push bends into an arc, px/s sideways
    swayHz: 1.2 + Math.random() * 1.8,
    swayAmp: 50 + Math.random() * 140,
    sway2: 0.15 + Math.random() * 0.5, sway2Hz: 0.35 + Math.random() * 0.5, // a second, slower wander
    sink: 16 + Math.random() * 30,                         // slow terminal fall, px per second
    settle: 0.03 + Math.random() * 0.05,                   // how quickly it gives in to the fall
    size: 22 + Math.random() * 66,
    sprite: randomLeafSprite(),
    spin: Math.random() * 6.3,
    tilt: Math.random() * Math.PI * 2,                                   // every leaf faces its own way
    drift: (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.22), // a slow turn, never a spin
    rock: 0.12 + Math.random() * 0.14, rockHz: 1.6 + Math.random() * 1.2, // how it rocks as it sways
    turn: 0.18 + Math.random() * 0.2, turnHz: 0.5 + Math.random() * 0.6,  // a slight, slow roll about the spine
    fold: 0.2 + Math.random() * 0.16,                                     // how cupped the blade is: a soft U
    born: t,
  });
}
function flyLeaves(t, dt, aboveTrees) {
  // a steady trickle for as long as the camera is at or above the treetops
  if (!aboveTrees && !flight) leavesMade = 0; // back under the canopy: the next visit starts fresh
  if (heroDue) { heroDue = false; if (leavesMade < MAX_LEAVES) { spawnLeaf(t, true); leavesMade++; nextLeafAt = t + 0.9; } }
  else if (aboveTrees && t > nextLeafAt && leavesMade < MAX_LEAVES) {
    spawnLeaf(t, false);
    leavesMade++;
    nextLeafAt = t + 0.8 + Math.random() * 1.6;
  }
  lctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = looseLeaves.length - 1; i >= 0; i--) {
    const L = looseLeaves[i];
    const gone = Math.hypot(L.x - L.from.x, L.y - L.from.y);
    if (L.fallAt === null && gone > L.total * L.giveOut) L.fallAt = t;
    // while pushed, the path curls a little to one side of the straight line
    const arc = Math.sin(Math.min(1, gone / (L.total * L.giveOut)) * Math.PI) * L.curl;
    let wantX = L.push.x - (L.push.y / (Math.hypot(L.push.x, L.push.y) || 1)) * arc;
    let wantY = L.push.y + (L.push.x / (Math.hypot(L.push.x, L.push.y) || 1)) * arc;
    let ease = 0.08;
    if (L.fallAt !== null) {
      const f = t - L.fallAt;
      // side to side, with a slower second wander so no two zigzags match
      wantX = (Math.sin(f * L.swayHz + L.spin) + Math.sin(f * L.swayHz * L.sway2Hz + L.spin * 2) * L.sway2) * L.swayAmp;
      wantY = Math.min(L.sink, 8 + f * 5);                 // and slowly down
      ease = L.settle;
    }
    L.vx += (wantX - L.vx) * ease;
    L.vy += (wantY - L.vy) * ease;
    L.x += L.vx * dt;
    L.y += L.vy * dt;
    if (L.y > innerHeight + 70 || L.x < -120 || L.x > innerWidth + 120) { looseLeaves.splice(i, 1); continue; }
    // each leaf has its own facing and turns only slowly; once it is sinking it
    // leans into every swing and rocks, as before. No spinning about itself.
    const age = t - L.born;
    const sinking = L.fallAt === null ? 0 : Math.min(1, (t - L.fallAt) / 1.5);
    const lean = (Math.atan2(L.vx, 140) * 0.9 + Math.sin(t * L.rockHz + L.spin) * L.rock) * sinking;
    const roll = L.tilt + L.drift * age + lean;
    // The blade is cupped along its spine. Each half is drawn on its own: as the
    // leaf rolls slowly about the spine one half turns toward us and widens while
    // the other turns away, narrows and falls into shade.
    const theta = Math.sin(t * L.turnHz + L.spin) * L.turn;
    const kl = Math.cos(theta + L.fold), kr = Math.cos(theta - L.fold);
    lctx.save();
    lctx.translate(L.x, L.y);
    lctx.rotate(roll);
    const fade = Math.min(1, (t - L.born) * 2), half = L.size / 2;
    const halves = [[0, -half * kl, half * kl + 0.6, kl], [64, 0, half * kr, kr]]; // [source x, dest x, dest width, facing]
    for (const [sx, dx, dw, k] of halves) {
      lctx.globalAlpha = fade;
      lctx.drawImage(L.sprite.base, sx, 0, 64, 128, dx, -half, dw, L.size);
      lctx.globalAlpha = fade * Math.min(0.5, (1 - k) * 4);
      lctx.drawImage(L.sprite.dark, sx, 0, 64, 128, dx, -half, dw, L.size);
    }
    lctx.restore();
  }
}

// ---- film grain -------------------------------------------------------------
// A handful of pre-baked noise tiles, one stamped across a device-pixel
// canvas at a random offset every other frame, so the grain crawls the way
// silver halide does instead of sitting still like a texture.
const grainC = document.getElementById('grain');
const gctx = grainC.getContext('2d');
const TILE = 192;
const tiles = Array.from({ length: 6 }, () => {
  const c = document.createElement('canvas');
  c.width = c.height = TILE;
  const cx = c.getContext('2d');
  const img = cx.createImageData(TILE, TILE);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    // fine, even grain: one speck per device pixel
    const v = 128 + (Math.random() - 0.5) * 200;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  return gctx.createPattern(c, 'repeat');
});
function sizeGrain() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  grainC.width = Math.ceil(innerWidth * dpr);
  grainC.height = Math.ceil(innerHeight * dpr);
}
let grainTick = 0;
function drawGrain() {
  gctx.setTransform(1, 0, 0, 1, Math.random() * TILE, Math.random() * TILE);
  gctx.fillStyle = tiles[Math.floor(Math.random() * tiles.length)];
  gctx.fillRect(-TILE, -TILE, grainC.width + TILE * 2, grainC.height + TILE * 2);
  // projector flicker: tiny exposure wobble
  grainC.style.opacity = (0.24 + Math.random() * 0.05).toFixed(3);
}
addEventListener('resize', () => { sizeGrain(); drawGrain(); });
sizeGrain();
drawGrain();

const clock = new THREE.Clock();
const dirV = new THREE.Vector3(), target = new THREE.Vector3();
function frame() {
  const t = clock.getElapsedTime();
  const dt = Math.min(0.05, t - lastT); lastT = t;
  const yBefore = camera.position.y;
  leafMat.uniforms.uTime.value = t;
  if (!reduceMotion && (grainTick++ & 1) === 0) drawGrain();

  let roll = 0;
  if (flight) {
    const el = t - flight.start;
    const u = Math.min(1, el / FLIGHT_S);
    const e = ease(u);
    camera.position.y = flight.from + (GROUND_Y + RISE - flight.from) * e;
    roll = reduceMotion ? 0 : u * u * 0.5;             // slow spiral as it climbs
    const baseFov = innerWidth > innerHeight ? 96 : 108;
    camera.fov = baseFov - 22 * Math.pow(u, 1.6);      // tightening toward the sky
    camera.updateProjectionMatrix();
    // blue holds until a second after the last leaf has left the frame, then a quick wash
    if (clearT === null && camera.position.y > LEAF_TOP) clearT = t;
    const wash = clearT === null ? -1 : t - clearT - WASH_DELAY; // seconds into the wash
    // same duration as before, but eased out and opened radially instead of all at once
    const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
    sky.material.uniforms.uLift.value = easeOut(wash / WASH_S);
    sky.material.uniforms.uReach.value = Math.atan(Math.tan((camera.fov * Math.PI) / 360) * Math.hypot(1, camera.aspect));
    inkFor(clearT === null ? 0 : sstep(-0.2, 0.12, wash)); // text goes dark just ahead of the wash
    if (u > 0.5) vignette.classList.add('lift');
    if (camera.position.y >= SKY_AT && skyStart === null) {
      skyStart = t;
      say('Mudra is a product designer with a background in CS and Human Computer Interaction.<br>She is currently enjoying the early days of fall.');
    }
    // each puff fades out as it passes right through the lens, so a cloud reads
    // as wisps streaming past rather than a white wall
    for (const { sp, base } of puffs) sp.material.opacity = base * sstep(0.4, 4.5, sp.position.distanceTo(camera.position));
    // the white layer follows a beat behind as a soft-edged disc, so the warm ring leads it
    if (wash >= 0) {
      const p = easeOut((wash - 0.1) / WASH_S), F = 80;
      const outer = p * (100 + F), inner = outer - F;
      flash.style.background = `radial-gradient(circle farthest-corner at 50% 50%, rgba(251,250,244,1) ${inner.toFixed(1)}%, rgba(251,250,244,0) ${outer.toFixed(1)}%)`;
      flash.classList.add('on');
    }
    // no return on its own: the white holds with the words on it until replay is pressed
    if (wash > WASH_S + 0.6 || el > FLIGHT_S + 0.8) replay.classList.add('show');
  } else {
    // at rest the slider sets how far up the trunks the viewer floats
    const goalY = heightFor(heightPct);
    camera.position.y += (goalY - camera.position.y) * (reduceMotion ? 1 : 0.07);
  }
  if (!flight && !reduceMotion) {
    // lying still: a breath of drift
    lookNow.x = Math.sin(t * 0.23) * 0.05;
    lookNow.y = Math.cos(t * 0.19) * 0.04;
  }

  const idle = flight ? 0.35 : 1;
  dirV.set(lookNow.x * 0.14 * idle, 1, lookNow.y * 0.14 * idle).normalize();
  target.copy(camera.position).add(dirV);
  camera.up.set(Math.sin(roll), 0, -Math.cos(roll));
  camera.lookAt(target);
  // entering 100%: the camera has just risen through the treetops
  const topY = heightFor(1) - 0.5; // a touch early, since the slider eases in and never quite lands
  if (yBefore < topY && camera.position.y >= topY) heroDue = true;
  flyLeaves(t, dt, camera.position.y >= topY);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
